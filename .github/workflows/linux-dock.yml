name: Linux Dock

on:
  push:
    branches: [feat/linux-dock]
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "web/**"
      - "linux/**"
      - ".github/workflows/linux-dock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-dock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: windows-2022
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PSP_DOCK_TEST_NO_REAL_USB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Import application without accessing USB
        run: python -c "import dock, native_dock, dock_product_flow, dock_product_session, retro_runtime, storage_layout"
      - name: Protocol, product session, emulator and storage regression
        shell: python
        run: |
          import sys
          import unittest

          patterns = [
              "test_native_dock.py",
              "test_dock_product_flow.py",
              "test_dock_product_session.py",
              "test_retro_runtime.py",
              "test_storage_layout.py",
              "test_start_dock.py",
          ]
          suite = unittest.TestSuite()
          for pattern in patterns:
              found = unittest.defaultTestLoader.discover("tests", pattern=pattern)
              if found.countTestCases() == 0:
                  raise SystemExit("No tests found for " + pattern)
              suite.addTests(found)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Browser menu and controller regression
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          tests = sorted(Path("tests").glob("xmb_*.test.js"))
          if not tests:
              raise SystemExit("XMB tests are missing")
          for test in tests:
              print(test, flush=True)
              subprocess.run(["node", str(test)], check=True)
      - name: Linux adapters with synthetic devices
        if: runner.os == 'Linux'
        shell: python
        run: |
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_linux*.py")
          if suite.countTestCases() == 0:
              raise SystemExit("Linux adapter tests are missing")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
