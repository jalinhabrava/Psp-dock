name: Linux Dock

on:
  push:
    branches: [feat/linux-dock]
  pull_request:
    paths:
      - "*.py"
      - "psp_dock/**"
      - "start-linux.sh"
      - "tests/**"
      - "web/**"
      - "linux/**"
      - "docs/LINUX.md"
      - ".github/workflows/linux-dock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-dock-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2022
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PSP_DOCK_TEST_NO_REAL_USB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install image test dependency
        run: python -m pip install Pillow==13.0.0
      - name: Select one browser for Python and JavaScript acceptance
        shell: python
        run: |
          from pathlib import Path
          import os
          import subprocess
          import sys

          sys.path.insert(0, str(Path.cwd() / "tests"))
          from test_frontend_i18n_browser import find_browser

          browser = find_browser()
          if not browser:
              raise SystemExit("Chrome/Chromium/Edge is required for browser acceptance")
          print("Browser acceptance binary:", browser, flush=True)
          if sys.platform.startswith("linux"):
              subprocess.run([browser, "--version"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("PSP_DOCK_CHROME=" + browser + "\n")
      - name: Import application without accessing USB
        run: python -c "import dock; from psp_dock.devices import native_dock, native_shutdown, linux_native, linux_shutdown; from psp_dock.core import dock_product_flow, dock_product_session, storage_layout; from psp_dock.emulation import retro_runtime, linux_runtime"
      - name: Full Python regression without physical USB
        shell: python
        run: |
          import sys
          import unittest
          from pathlib import Path

          # Actions runs this script from its temp directory, not the repo.
          sys.path.insert(0, str(Path.cwd()))
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          if suite.countTestCases() == 0:
              raise SystemExit("Python tests are missing")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Browser menu and controller regression
        shell: python
        run: |
          from pathlib import Path
          import os
          import subprocess
          import sys

          tests = sorted(Path("tests").glob("*.test.js"))
          if not tests:
              raise SystemExit("XMB tests are missing")
          child_env = dict(os.environ, PSP_DOCK_PYTHON=sys.executable)
          for test in tests:
              print(test, flush=True)
              subprocess.run(["node", str(test)], env=child_env, check=True)
      - name: Package the Linux preview
        if: runner.os == 'Linux'
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import tempfile

          archive = Path("PSP-Dock-Linux-preview.tar.gz")
          subprocess.run([
              "git", "archive", "--format=tar.gz", "--prefix=PSP-Dock-Linux/",
              "--output=" + str(archive), "HEAD", "dock.py", "start_dock.py",
              "start-linux.sh", "psp_dock", "web", "linux", "docs/LINUX.md",
              "texture_catalog_sources.json",
              "LICENSE.md", "NOTICE.md", "THIRD_PARTY_NOTICES.md",
          ], check=True)
          with tempfile.TemporaryDirectory() as directory:
              with tarfile.open(archive) as package:
                  package.extractall(directory, filter="data")
              root = Path(directory) / "PSP-Dock-Linux"
              if not root.joinpath("start-linux.sh").stat().st_mode & 0o111:
                  raise SystemExit("The Linux launcher must be executable")
              subprocess.run([sys.executable, "-c", "import dock, start_dock; assert dock.linux_host()"],
                             cwd=root, check=True)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256").write_text(checksum + "  " + archive.name + "\n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: PSP-Dock-Linux-preview
          path: |
            PSP-Dock-Linux-preview.tar.gz
            PSP-Dock-Linux-preview.tar.gz.sha256
          if-no-files-found: error
