name: Android TV Dock

on:
  push:
    branches: [feat/android-tv-dock]
    paths:
      - "android-tv/**"
      - "!android-tv/**/*.md"
      - ".github/workflows/android-tv.yml"
      - "psp_dock/devices/native_dock.py"
      - "homebrew/native-dock/native_protocol.h"
      - "homebrew/native-dock/native_driver.c"
  pull_request:
    paths:
      - "android-tv/**"
      - "!android-tv/**/*.md"
      - ".github/workflows/android-tv.yml"
      - "psp_dock/devices/native_dock.py"
      - "homebrew/native-dock/native_protocol.h"
      - "homebrew/native-dock/native_driver.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-dock-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PSP_DOCK_TEST_NO_REAL_USB: "1"
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-tv/**/*.gradle.kts
            android-tv/gradle/wrapper/gradle-wrapper.properties
      - name: Verify parity with the current Windows protocol
        run: python3 protocol/windows_vectors.py --check
      - name: Install pinned Android SDK, NDK and CMake
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1" </dev/null
      - name: Prepare and verify pinned PPSSPP sources
        run: python3 scripts/prepare_engine.py
      - name: Test engine boundaries, protocol parity and APK validation
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Unit tests and Android lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :session-contract:test :app:testDebugUnitTest :app:lintDebug
      - name: Build both ARM architectures
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify the complete APK and optimized native engine
        run: |
          python3 scripts/verify_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --sdk "$ANDROID_HOME" \
            --native-build-dir ppsspp-engine/.cxx \
            --report app/build/reports/dock-apk.json
      # The current project license needs an Android-specific decision before
      # public binary distribution; see android-tv/LICENSING.md.
      - name: Android TV debug APK
        if: vars.ANDROID_TV_DISTRIBUTION_READY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: psp-dock-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tv-validation
          path: |
            android-tv/app/build/reports/dock-apk.json
            android-tv/app/build/reports/tests/
            android-tv/app/build/reports/lint-results-debug.*
            android-tv/session-contract/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
