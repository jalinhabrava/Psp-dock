name: Android TV Dock

on:
  push:
    branches: [feat/android-tv-dock]
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-dock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android SDK, NDK and CMake
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1" </dev/null
      - name: Prepare and verify pinned PPSSPP sources
        run: python3 scripts/prepare_engine.py
      - name: Test embedded engine boundaries against upstream
        run: python3 -m unittest discover -s tests -p test_engine_embedding.py -v
      - name: Build APK and run unit tests and Android lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :session-contract:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify that the APK contains the engine for both ARM architectures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apks = list(Path("app/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit("Expected one Android TV APK")
          with zipfile.ZipFile(apks[0]) as apk:
              for abi in ("arm64-v8a", "armeabi-v7a"):
                  path = "lib/" + abi + "/libppsspp_jni.so"
                  binary = apk.read(path)
                  if not binary.startswith(b"\x7fELF") or len(binary) < 1000000:
                      raise SystemExit("Missing or invalid embedded engine: " + abi)
              print("Embedded PPSSPP verified in", apks[0])
          PY
      - name: Android TV debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: psp-dock-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tv-validation
          path: |
            android-tv/app/build/reports/tests/
            android-tv/app/build/reports/lint-results-debug.*
            android-tv/session-contract/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
